name: Deploy the run server

# The website deploys itself through Workers; the run server lives on a droplet, so a merge ends here.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-run-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize the droplet
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # the host key is pinned in a secret, so a hijacked DNS answer cannot collect the deploy key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and rebuild
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@$HOST" '
            set -e
            cd /root/wearable-validator
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            docker compose -f deploy/docker-compose.yml up -d --build
            docker image prune -f >/dev/null
          '

      - name: Wait for it to answer
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          for i in $(seq 1 30); do
            body=$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@$HOST" 'curl -s --max-time 5 http://127.0.0.1:4180/api/health' || true)
            case "$body" in *'"ok":true'*) echo "$body"; exit 0 ;; esac
            sleep 10
          done
          echo "the server did not answer after the deploy"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@$HOST" 'cd /root/wearable-validator && docker compose -f deploy/docker-compose.yml logs --tail 40 validator'
          exit 1
