name: Publish the library

# Every merge to main that touches the library publishes @dcl-regenesislabs/wearable-validator through
# npm's trusted publishing (GitHub OIDC): no npm token anywhere, and nothing to tag. Bump the version in
# the same PR; npm refuses a version it already has. Set the trusted publisher once on npmjs.com (package → Settings →
# Trusted Publisher: this repository, workflow release.yml).
on:
  push:
    branches: [main]
    paths: ["packages/wearable-validator/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-library
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5 or newer
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck -w @dcl-regenesislabs/wearable-validator
      - run: npm test -w @dcl-regenesislabs/wearable-validator
      - run: npm run build -w @dcl-regenesislabs/wearable-validator
      # npm refuses a version it already has: a library change merged without a bump fails here, on purpose
      - run: npm publish --provenance --access public -w @dcl-regenesislabs/wearable-validator
